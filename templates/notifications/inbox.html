{% extends "base.html" %}

{% block title %}Notifications | {{ brand.name }}{% endblock %}
{% block og_title %}Notifications | {{ brand.name }}{% endblock %}

{% block content %}
<section class="dc-notif-page-wrap max-w-[1700px] w-full mx-auto px-4 md:px-8 py-6 md:py-8 flex flex-col lg:flex-row gap-8">
  <div class="w-full lg:w-72 flex-shrink-0">
    <div class="sticky top-28">
      <div class="mb-6">
        <h1 class="font-display font-bold text-3xl text-white tracking-tight">Notifications</h1>
        <p class="text-sm mt-1" style="color:var(--ol-text-muted,#A8A39A)">Updates about your tournaments, teams and account.</p>
      </div>

      <nav class="flex flex-row lg:flex-col gap-2 overflow-x-auto pb-4 lg:pb-0 dc-scrollbar-hide" aria-label="Filter notifications">
        <button type="button" aria-pressed="true" class="dc-filter-btn active w-full flex items-center justify-between px-4 py-3 rounded-xl font-semibold text-sm text-white bg-white/6 shrink-0" data-filter="ALL">
          <span>All Notifications</span>
          <span class="dc-filter-count" data-count="ALL">0</span>
        </button>

        <button type="button" aria-pressed="false" class="dc-filter-btn w-full flex items-center justify-between px-4 py-3 rounded-xl font-medium text-sm text-slate-300 hover:bg-white/5 hover:text-white shrink-0" data-filter="TOURNAMENT">
          <span>Tournaments</span>
          <span class="dc-filter-count" data-count="TOURNAMENT">0</span>
        </button>

        <button type="button" aria-pressed="false" class="dc-filter-btn w-full flex items-center justify-between px-4 py-3 rounded-xl font-medium text-sm text-slate-300 hover:bg-white/5 hover:text-white shrink-0" data-filter="TEAM">
          <span>Teams & Orgs</span>
          <span class="dc-filter-count" data-count="TEAM">0</span>
        </button>

        <button type="button" aria-pressed="false" class="dc-filter-btn w-full flex items-center justify-between px-4 py-3 rounded-xl font-medium text-sm text-slate-300 hover:bg-white/5 hover:text-white shrink-0" data-filter="ECONOMY">
          <span>Economy</span>
          <span class="dc-filter-count" data-count="ECONOMY">0</span>
        </button>

        <button type="button" aria-pressed="false" class="dc-filter-btn w-full flex items-center justify-between px-4 py-3 rounded-xl font-medium text-sm text-slate-300 hover:bg-white/5 hover:text-white shrink-0" data-filter="SOCIAL">
          <span>Social</span>
          <span class="dc-filter-count" data-count="SOCIAL">0</span>
        </button>
      </nav>
    </div>
  </div>

  <section class="flex-1 flex flex-col gap-6 pb-16">
    <div class="flex justify-between items-center border-b border-white/10 pb-4">
      <p class="text-sm text-slate-400 font-medium" id="dc-feed-count">Loading notifications…</p>
      <div class="flex gap-4">
        <button type="button" id="dc-page-mark-all" class="text-sm font-semibold text-slate-300 hover:text-white transition flex items-center gap-2">
          <i class="fa-solid fa-check-double" aria-hidden="true"></i>
          Mark all as read
        </button>
        <button type="button" id="dc-page-clear-all" class="text-sm font-semibold text-slate-300 hover:text-white transition flex items-center gap-2">
          <i class="fa-regular fa-trash-can" aria-hidden="true"></i>
          Clear all
        </button>
      </div>
    </div>

    <div id="dc-main-feed" class="flex flex-col gap-0 relative"></div>

    <button type="button" id="dc-load-more-btn" class="mt-2 py-4 w-full rounded-xl border border-white/5 bg-white/[0.02] text-slate-300 hover:text-white hover:bg-white/[0.05] hover:border-white/10 transition font-semibold text-sm flex items-center justify-center gap-2 group">
      Load older notifications
      <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
    </button>
  </section>
</section>
{% endblock %}
