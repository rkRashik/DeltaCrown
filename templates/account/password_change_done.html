{% extends "base.html" %}
{% load static %}
{% block title %}Password changed — {{ brand.name }}{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'siteui/css/auth.css' %}?v={{ STATIC_VERSION|default:'ownlobby-1' }}" />
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card auth-card--status">
        <div class="auth-status-icon auth-status-icon--success" aria-hidden="true"><i class="fas fa-check"></i></div>
        <h1 class="auth-status-title">Password changed</h1>
        <p class="auth-status-text">Your password has been updated. You stay signed in on this device.</p>
        <div class="auth-status-actions">
            <a href="{% url 'user_profile:profile_settings' %}" class="btn-auth">Back to settings</a>
            <a href="{% url 'user_profile:profile_public' username=request.user.username %}" class="auth-link" style="justify-content:center">View profile</a>
        </div>
    </div>
</div>
{% endblock %}
