{% extends "base.html" %}
{% load static %}
{% block title %}Password updated — {{ brand.name }}{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'siteui/css/auth.css' %}?v={{ STATIC_VERSION|default:'ownlobby-1' }}" />
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card auth-card--status">
        <div class="auth-status-icon auth-status-icon--success" aria-hidden="true"><i class="fas fa-check"></i></div>
        <h1 class="auth-status-title">Password Updated</h1>
        <p class="auth-status-text">Sign in with your new password.</p>
        <div class="auth-status-actions">
            <a href="{% url 'account:login' %}" class="btn-auth">Sign in</a>
        </div>
    </div>
</div>
{% endblock %}
