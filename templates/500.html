{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Something went wrong — OwnLobby</title>
  <link rel="stylesheet" href="{% static 'ownlobby/brand.css' %}">
  <link rel="stylesheet" href="{% static 'ownlobby/foundation.css' %}">
  <link rel="stylesheet" href="{% static 'siteui/css/error_pages.css' %}">
</head>
<body class="err-standalone">
  <main class="err-page">
    <div class="err-card">
      <a class="err-brand" href="/">Own<span>Lobby</span></a>
      <p class="err-code">Error 500</p>
      <h1 class="err-title">Something went wrong on our side</h1>
      <p class="err-desc">Your request could not be completed, and nothing you did caused this. Wait a moment and try again.</p>
      <div class="err-actions">
        <a class="ol-btn ol-btn--primary" href="/">Go to home</a>
      </div>
      <p class="err-links">If it keeps happening, <a href="/contact/">contact support</a>.</p>
    </div>
  </main>
</body>
</html>
