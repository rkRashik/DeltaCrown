<div id="dc-notif-menu" class="dc-dropdown">
  <div class="notif-caret"></div>

  <div class="notif-header">
    <div style="display:flex;align-items:center;">
      <span class="notif-header__title">Notifications</span>
      <span class="notif-header__pill" id="dc-notif-header-pill">{% if nav_unread_count > 0 %}{{ nav_unread_count }} new{% endif %}</span>
    </div>
    <div class="notif-header__actions">
      <button class="notif-header__btn" id="dc-mark-read-btn" type="button">Mark all read</button>
      <a href="/notifications/settings/" class="notif-header__btn notif-header__btn--icon" aria-label="Notification settings"><i class="ph ph-gear-six"></i></a>
    </div>
  </div>

  <div class="notif-tabs" id="dc-notif-tabs">
    <button class="notif-tab active" data-filter="ALL">All <span class="notif-tab__count" id="dc-tab-count-all"></span></button>
    <button class="notif-tab" data-filter="TOURNAMENT">Tournament</button>
    <button class="notif-tab" data-filter="TEAM">Team</button>
    <button class="notif-tab" data-filter="ECONOMY">Economy</button>
    <button class="notif-tab" data-filter="SOCIAL">Social</button>
    <button class="notif-tab" data-filter="WARNING">Alerts</button>
  </div>

  <div class="notif-list" id="dc-notif-content"></div>

  <a href="/notifications/" class="notif-footer">
    View all notifications <i class="ph ph-arrow-right" style="font-size:15px;"></i>
  </a>
</div>
