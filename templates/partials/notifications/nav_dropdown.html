<div id="dc-notif-menu" class="dc-dropdown" role="dialog" aria-modal="false" aria-labelledby="dc-notif-title" tabindex="-1" inert>
  <div class="notif-caret"></div>

  <div class="notif-header">
    <div style="display:flex;align-items:center;">
      <h2 class="notif-header__title" id="dc-notif-title">Notifications</h2>
      <span class="notif-header__pill" id="dc-notif-header-pill">{% if nav_unread_count > 0 %}{{ nav_unread_count }} new{% endif %}</span>
    </div>
    <div class="notif-header__actions">
      <button class="notif-header__btn" id="dc-mark-read-btn" type="button">Mark all read</button>
      <a href="/notifications/settings/" class="notif-header__btn notif-header__btn--icon" aria-label="Notification settings"><i class="ph ph-gear-six" aria-hidden="true"></i></a>
    </div>
  </div>

  <div class="notif-tabs" id="dc-notif-tabs" role="tablist" aria-label="Filter notifications">
    <button type="button" role="tab" id="dc-notif-tab-ALL" class="notif-tab active" data-filter="ALL" aria-selected="true" aria-controls="dc-notif-content" tabindex="0">All</button>
    <button type="button" role="tab" id="dc-notif-tab-TOURNAMENT" class="notif-tab" data-filter="TOURNAMENT" aria-selected="false" aria-controls="dc-notif-content" tabindex="-1">Tournament</button>
    <button type="button" role="tab" id="dc-notif-tab-TEAM" class="notif-tab" data-filter="TEAM" aria-selected="false" aria-controls="dc-notif-content" tabindex="-1">Team</button>
    <button type="button" role="tab" id="dc-notif-tab-ECONOMY" class="notif-tab" data-filter="ECONOMY" aria-selected="false" aria-controls="dc-notif-content" tabindex="-1">Economy</button>
    <button type="button" role="tab" id="dc-notif-tab-SOCIAL" class="notif-tab" data-filter="SOCIAL" aria-selected="false" aria-controls="dc-notif-content" tabindex="-1">Social</button>
    <button type="button" role="tab" id="dc-notif-tab-WARNING" class="notif-tab" data-filter="WARNING" aria-selected="false" aria-controls="dc-notif-content" tabindex="-1">Alerts</button>
  </div>

  <div class="notif-list" id="dc-notif-content" role="tabpanel" aria-labelledby="dc-notif-tab-ALL" tabindex="0"></div>

  <a href="/notifications/" class="notif-footer">
    View all notifications <i class="ph ph-arrow-right" style="font-size:15px;" aria-hidden="true"></i>
  </a>
</div>
