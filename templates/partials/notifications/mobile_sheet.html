<div id="dc-mobile-notif-overlay" class="notif-scrim md:hidden" aria-hidden="true"></div>
<div id="dc-mobile-notif-sheet"
     class="notif-sheet md:hidden"
     role="dialog"
     aria-modal="true"
     aria-labelledby="dc-mobile-notif-title"
     aria-hidden="true">

  <div class="notif-sheet__grabber" id="dc-mobile-notif-handle">
    <div class="notif-sheet__grabber-pill"></div>
  </div>

  <div class="notif-sheet__header">
    <div class="notif-sheet__title-row">
      <h3 id="dc-mobile-notif-title" class="notif-sheet__title">Notifications</h3>
      <button class="notif-sheet__mark-btn" id="dc-mobile-mark-read" type="button">Mark all read</button>
    </div>
    <div class="notif-sheet__tabs" id="dc-mobile-tabs">
      <button class="notif-sheet__tab active" data-filter="ALL">All</button>
      <button class="notif-sheet__tab" data-filter="TOURNAMENT">Tournament</button>
      <button class="notif-sheet__tab" data-filter="TEAM">Team</button>
      <button class="notif-sheet__tab" data-filter="ECONOMY">Economy</button>
      <button class="notif-sheet__tab" data-filter="SOCIAL">Social</button>
      <button class="notif-sheet__tab" data-filter="WARNING">Alerts</button>
    </div>
  </div>

  <div class="notif-sheet__list" id="dc-mobile-notif-content"></div>
</div>
