name: OwnLobby Linux release smoke

on:
  pull_request:
    branches: [master]

concurrency:
  group: ownlobby-linux-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'pull_request' && (github.head_ref == 'feature/ownlobby-free-hosting' || github.head_ref == 'feature/ownlobby-single-service-lockdown-cutover' || github.head_ref == 'feature/ownlobby-final-private-origin-probe' || github.head_ref == 'feature/ownlobby-final-record-canary-20261028' || github.head_ref == 'hotfix/ownlobby-media-throttle-redis-timeout-20261028' || github.head_ref == 'hotfix/ownlobby-s3-async-media-stream-20261028' || github.head_ref == 'hotfix/ownlobby-launch-public-cache-static-20261028' || github.head_ref == 'qa/ownlobby-account-and-launch-smoke-20261028' || github.head_ref == 'qa/ownlobby-public-routes-smoke-20261028')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ownlobby_qa
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: ownlobby_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ownlobby_qa -d ownlobby_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Disposable runner-only values; never inject repository/environment secrets.
      DATABASE_URL: postgresql://ownlobby_qa:synthetic-ci-only@127.0.0.1:5432/ownlobby_unused
      DATABASE_URL_TEST: postgresql://ownlobby_qa:synthetic-ci-only@127.0.0.1:5432/ownlobby_test
      DJANGO_SECRET_KEY: synthetic-ci-only-not-a-production-key-0123456789-abcdefghijklmnopqrstuvwxyz
      DJANGO_SETTINGS_MODULE: deltacrown.settings_media_qa
      DISABLE_INPROCESS_MATCH_REMINDER: '1'
      ENABLE_DISCORD_BOT: '0'
      ENABLE_CELERY_BEAT: '0'
      COMPETITION_APP_ENABLED: '1'
      SENTRY_DSN: ''
      REDIS_URL: ''
      S3_TESTS: '0'
      AWS_EC2_METADATA_DISABLED: 'true'
      NODE_OPTIONS: --max-old-space-size=256
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libcairo2-dev libffi-dev libfreetype6-dev libmagic1 fonts-dejavu-core
          python --version
          uname -a
      - name: Clean production install and Twisted integrity
        run: |
          python scripts/build_twisted_backport.py
          python -m pip install --no-cache-dir -r requirements-prod.txt
          python -m pip check
          python -c "from importlib.metadata import version; assert version('Twisted') == '26.4.0+ownlobby.1'; print('Installed Twisted backport verified')"
      - name: Native Cairo and PDF rendering
        run: python scripts/check_native_rendering.py
      - name: Django startup and system checks
        run: |
          mkdir -p Artifacts/final-engineering
          python manage.py check --settings=deltacrown.settings_media_qa
          python -c "import deltacrown.asgi; print('Django ASGI startup passed')"
      - name: Daphne HTTP and WebSocket transport
        run: python scripts/check_http_transport.py
      - name: Focused security and media regressions
        run: |
          python manage.py test apps.common.tests.test_governed_media apps.common.tests.test_media_throttle_cache apps.common.tests.test_s3_async_media_stream apps.common.tests.test_game_poster_preview apps.common.tests.test_public_cache_fallback apps.common.tests.test_public_game_image_cache apps.common.tests.test_http_transport_security apps.common.tests.test_upload_content_security apps.common.tests.test_dependency_compatibility apps.common.tests.test_free_hosting --settings=deltacrown.settings_media_qa --keepdb --noinput --verbosity 1
      - name: Recovery and containment regressions (disposable QA only)
        run: |
          python -m unittest tests.test_cloudinary_containment_status tests.test_private_media_probe tests.test_chat_media_recovery tests.test_render_processes tests.test_ownlobby_cutover_lockdown tests.test_cutover_deploy_guard tests.test_ownlobby_cdn_variant_audit -v
          python manage.py test apps.common.tests.test_launch_execution apps.common.tests.test_hybrid_media apps.common.tests.test_media_profile_privacy apps.common.tests.test_request_memory_probe apps.common.tests.test_js_probe_shield --settings=deltacrown.settings_media_qa --noinput --verbosity 1
      - name: Account, public profile, and launch-readiness regressions (disposable QA)
        run: |
          python manage.py test apps.common.tests.test_release_readiness apps.siteui.tests.test_ownlobby_branding --settings=deltacrown.settings_media_qa --noinput --verbosity 1
      - name: Read-only LIVE public route smoke (no production writes)
        run: |
          python - <<'PY'
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen
          paths = ["/healthz/", "/", "/community/", "/tournaments/", "/account/signup/"]
          failures = []
          for path in paths:
              start = time.monotonic()
              try:
                  request = Request(
                      "https://ownlobby.com" + path,
                      headers={"User-Agent": "OwnLobby-Public-Smoke/1.0"},
                      method="GET",
                  )
                  with urlopen(request, timeout=20) as response:
                      status = response.status
                      kind = response.headers.get("Content-Type", "")
                      first_bytes = response.read(256)
              except HTTPError as error:
                  status, kind, first_bytes = error.code, "", b""
              except (URLError, TimeoutError, OSError) as error:
                  status, kind, first_bytes = 0, "", b""
                  print(f"SMOKE {path} request_error={type(error).__name__}")
              elapsed_ms = int((time.monotonic() - start) * 1000)
              print(f"SMOKE path={path} status={status} elapsed_ms={elapsed_ms} type={kind} body_bytes={len(first_bytes)}")
              if status != 200 or (path != "/healthz/" and "text/html" not in kind):
                  failures.append((path, status))
          if failures:
              raise SystemExit(f"Public smoke failures: {failures}")
          print("OWNLOBBY_LIVE_PUBLIC_ROUTES_PASS")
          PY
      - name: Frontend production build
        run: |
          npm ci --include=dev
          npm run build
      - name: Hashed static collection, templates and approved assets
        env:
          DJANGO_SETTINGS_MODULE: deltacrown.settings_brand_qa
        run: python scripts/verify_ownlobby.py --collect-static
