<svg width="1920" height="420" viewBox="0 0 1920 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Team banner placeholder">
  <!-- Neutral OwnLobby placeholder: no wordmark, brand tokens only (canvas #0B0C0C, surface #17181A, hairline grid). -->
  <defs>
    <linearGradient id="bannerGrad" x1="0" y1="0" x2="1920" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0C0C"/>
      <stop offset="50%" stop-color="#17181A"/>
      <stop offset="100%" stop-color="#0B0C0C"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(246,241,231,0.04)" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1920" height="420" fill="url(#bannerGrad)"/>
  <rect width="1920" height="420" fill="url(#grid)"/>
</svg>
